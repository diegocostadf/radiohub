# Builds RadioHub for Mac (Apple Silicon + Intel) and Windows (x64 + x86)
# and publishes a GitHub Release whenever package.json on main carries a
# version that has no release yet (bump the version = publish).
name: Release
on:
  push:
    branches: [main]
    paths: ['package.json']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  # DMR programmer (qdmr's dmrconf) bundled for each Mac architecture.
  # Intel is best effort: if it fails, the Intel build ships without DMR.
  dmr:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-14
          - arch: x64
            runner: macos-15-intel
    runs-on: ${{ matrix.runner }}
    continue-on-error: ${{ matrix.arch == 'x64' }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Install qdmr
        run: brew install qdmr
      - name: Bundle dmrconf
        run: bash build/bundle-dmrconf.sh "out/providers"
      - name: Smoke test
        run: |
          curl -fsSL -o potsdam.yaml https://raw.githubusercontent.com/hmatuschek/qdmr/v0.15.1/examples/potsdam.yaml
          python3 build/dmr-smoke.py "$PWD/out/providers/qdmr/Contents/MacOS/dmrconf" potsdam.yaml
      # tar keeps the framework symlinks and the executable bit
      - name: Pack
        run: tar -czf dmr-darwin-${{ matrix.arch }}.tgz -C out providers
      - uses: actions/upload-artifact@v4
        with:
          name: dmr-darwin-${{ matrix.arch }}
          path: dmr-darwin-${{ matrix.arch }}.tgz

  build:
    needs: dmr
    if: ${{ !cancelled() }}
    runs-on: macos-14
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Version and release check
        id: ver
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V=$(node -p "require('./package.json').version")
          echo "version=$V" >> "$GITHUB_OUTPUT"
          if gh release view "v$V" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release v$V already exists; nothing to publish."; echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Install dependencies
        if: steps.ver.outputs.publish == 'true' || github.event_name == 'workflow_dispatch'
        run: npm ci
      - name: Fetch Python runtimes
        if: steps.ver.outputs.publish == 'true' || github.event_name == 'workflow_dispatch'
        run: bash build/fetch-python.sh
      - name: DMR programmer (Apple Silicon)
        if: steps.ver.outputs.publish == 'true' || github.event_name == 'workflow_dispatch'
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: dmr-darwin-arm64
          path: dmr-dl/arm64
      - name: DMR programmer (Intel)
        if: steps.ver.outputs.publish == 'true' || github.event_name == 'workflow_dispatch'
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: dmr-darwin-x64
          path: dmr-dl/x64
      - name: Check DMR bundles
        if: steps.ver.outputs.publish == 'true' || github.event_name == 'workflow_dispatch'
        run: |
          for A in arm64 x64; do
            D=pybuild/darwin-$A/providers
            rm -rf "$D"; mkdir -p "pybuild/darwin-$A"
            if [ -f "dmr-dl/$A/dmr-darwin-$A.tgz" ]; then tar -xzf "dmr-dl/$A/dmr-darwin-$A.tgz" -C "pybuild/darwin-$A"; fi
            mkdir -p "$D"
            if [ -x "$D/qdmr/Contents/MacOS/dmrconf" ]; then echo "DMR $A: incluído"; else echo "DMR $A: ausente"; echo "Sem programador DMR nesta arquitetura." > "$D/LEIA-ME.txt"; fi
          done
          test -x pybuild/darwin-arm64/providers/qdmr/Contents/MacOS/dmrconf
      - name: Package apps
        if: steps.ver.outputs.publish == 'true' || github.event_name == 'workflow_dispatch'
        run: |
          npm run package:mac-arm64
          npm run package:mac-x64
          npm run package:win-x64
          npm run package:win-ia32
      - name: Windows exe metadata
        if: steps.ver.outputs.publish == 'true' || github.event_name == 'workflow_dispatch'
        run: |
          V=$(node -p "require('./package.json').version")
          node build/set-exe-meta.js dist/RadioHub-win32-x64/RadioHub.exe build/icon.ico "$V"
          node build/set-exe-meta.js dist/RadioHub-win32-ia32/RadioHub.exe build/icon.ico "$V"
      - name: Windows installers (NSIS)
        if: steps.ver.outputs.publish == 'true' || github.event_name == 'workflow_dispatch'
        run: |
          brew install makensis
          V=$(node -p "require('./package.json').version")
          mkdir -p dist/release
          cd build
          makensis -V2 -DARCH=x64 -DVERSION="$V" -DSRC="$GITHUB_WORKSPACE/dist/RadioHub-win32-x64" -DOUT="$GITHUB_WORKSPACE/dist/release/RadioHub-Setup-win-x64.exe" installer.nsi
          makensis -V2 -DARCH=ia32 -DVERSION="$V" -DSRC="$GITHUB_WORKSPACE/dist/RadioHub-win32-ia32" -DOUT="$GITHUB_WORKSPACE/dist/release/RadioHub-Setup-win-x86.exe" installer.nsi
      - name: Mac DMGs (ad-hoc signed)
        if: steps.ver.outputs.publish == 'true' || github.event_name == 'workflow_dispatch'
        run: |
          V=$(node -p "require('./package.json').version")
          for A in arm64 x64; do
            APP="dist/RadioHub-darwin-$A/RadioHub.app"
            xattr -cr "$APP"
            codesign --force --deep --sign - "$APP"
            codesign --verify --deep --strict "$APP"
            STAGE=$(mktemp -d); cp -R "$APP" "$STAGE/"; ln -s /Applications "$STAGE/Aplicativos"
            hdiutil create -volname "RadioHub $V" -srcfolder "$STAGE" -fs HFS+ -format UDZO -imagekey zlib-level=9 -ov "dist/release/RadioHub-mac-$A.dmg"
            hdiutil verify "dist/release/RadioHub-mac-$A.dmg"
          done
          cd dist/release && shasum -a 256 * > SHA256SUMS.txt && ls -la
      - name: Publish release
        if: steps.ver.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V=${{ steps.ver.outputs.version }}
          NOTES=build/release-notes.md
          [ -f "$NOTES" ] || echo "RadioHub $V" > "$NOTES"
          gh release create "v$V" dist/release/* --target "$GITHUB_SHA" --title "RadioHub $V" --notes-file "$NOTES"
      - name: Keep artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: radiohub-builds
          path: dist/release/
